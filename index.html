<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A multilingual homework tracker">
<title>Homework Tracker</title>

<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --border: #cbd5e1;
  --primary: #2563eb;
  --danger: #dc2626;
  --success: #15803d;
  --warning: #c2410c;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 12px;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.container {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 24px;
  background: var(--card);
  border-radius: 18px;
  box-shadow: 0 8px 25px #0000000d;
}

.topbar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

select, input, button {
  font: inherit;
}

select, input[type="text"] {
  min-width: 0;
  padding: 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
}

h1 {
  text-align: center;
  font-size: clamp(24px, 5vw, 32px);
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: var(--muted);
  margin-top: 0;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin: 14px 0 6px;
}

#taskInput, #dateInput {
  width: 100%;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 9px;
  padding: 10px 14px;
  font-weight: bold;
}

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid #93c5fd;
  outline-offset: 2px;
}

.add-button {
  width: 100%;
  margin-top: 18px;
  background: var(--primary);
  color: white;
  padding: 13px;
}

.add-button:hover {
  background: #1d4ed8;
}

.summary {
  margin-top: 25px;
  font-weight: bold;
}

#taskList {
  padding: 0;
  margin: 0;
  list-style: none;
}

.task {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 15px 0;
  border-bottom: 1px solid #e2e8f0;
}

.task-checkbox {
  width: 19px;
  height: 19px;
  margin-top: 5px;
  flex-shrink: 0;
  cursor: pointer;
}

.task-info {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.task-name {
  font-weight: bold;
  white-space: pre-wrap;
}

.task-date, .status {
  font-size: 13px;
  margin-top: 5px;
}

.task-date {
  color: var(--muted);
}

.status {
  display: block;
  font-weight: bold;
}

.overdue {
  color: var(--danger);
}

.today {
  color: var(--warning);
}

.soon {
  color: var(--primary);
}

.completed .task-name {
  text-decoration: line-through;
  color: #94a3b8;
}

.delete-button {
  background: #fee2e2;
  color: #b91c1c;
  flex-shrink: 0;
}

.delete-button:hover {
  background: #fecaca;
}

.empty {
  text-align: center;
  padding: 25px 0;
  color: var(--muted);
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 22px;
}

@media (max-width: 480px) {
  body {
    padding: 12px 8px;
  }

  .container {
    padding: 17px;
  }

  .topbar {
    justify-content: space-between;
  }

  .task {
    gap: 7px;
  }

  .delete-button {
    padding: 8px;
  }
}
</style>
</head>

<body>
<main class="container">

  <div class="topbar">
    <label for="language" id="languageLabel">🌐 ภาษา</label>
    <select id="language">
      <option value="th">🇹🇭 ไทย</option>
      <option value="en">🇬🇧 English</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="zh">🇨🇳 中文</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
    </select>
  </div>

  <h1 id="title">📚 จัดการการบ้าน</h1>
  <p class="subtitle" id="subtitle">
    จัดการการบ้านให้เป็นระเบียบ ไม่พลาดวันส่ง
  </p>

  <form id="taskForm">
    <label for="taskInput" id="taskLabel">ชื่อการบ้าน</label>
    <input
      id="taskInput"
      type="text"
      maxlength="150"
      required
      autocomplete="off"
      placeholder="เช่น คณิตศาสตร์ หน้า 25"
    >

    <label for="dateInput" id="dateLabel">วันกำหนดส่ง</label>
    <input id="dateInput" type="date">

    <button class="add-button" id="addButton" type="submit">
      ＋ เพิ่มการบ้าน
    </button>
  </form>

  <p class="summary" id="summary" aria-live="polite"></p>
  <ul id="taskList"></ul>

  <p class="footer" id="footer">
    ข้อมูลบันทึกไว้ในเบราว์เซอร์ของอุปกรณ์นี้
  </p>
</main>

<script>
"use strict";

const translations = {
  th: {
    language: "ภาษา",
    title: "📚 จัดการการบ้าน",
    subtitle: "จัดการการบ้านให้เป็นระเบียบ ไม่พลาดวันส่ง",
    task: "ชื่อการบ้าน",
    placeholder: "เช่น คณิตศาสตร์ หน้า 25",
    date: "วันกำหนดส่ง",
    add: "＋ เพิ่มการบ้าน",
    total: (a, p, d) => `ทั้งหมด ${a} งาน | ค้างอยู่ ${p} งาน | เสร็จแล้ว ${d} งาน`,
    empty: "ยังไม่มีการบ้าน ลองเพิ่มงานแรกเลย!",
    due: "กำหนดส่ง: ",
    noDate: "ไม่ระบุวันส่ง",
    overdue: "⚠️ เลยกำหนดส่งแล้ว",
    today: "🔔 ต้องส่งวันนี้",
    left: n => `เหลืออีก ${n} วัน`,
    soon: n => `ใกล้ถึงกำหนด อีก ${n} วัน`,
    delete: "ลบ",
    invalid: "กรุณากรอกชื่อการบ้าน",
    footer: "ข้อมูลบันทึกไว้ในเบราว์เซอร์ของอุปกรณ์นี้"
  },

  en: {
    language: "Language",
    title: "📚 Homework Tracker",
    subtitle: "Organize your homework and never miss a deadline.",
    task: "Homework name",
    placeholder: "e.g. Mathematics, page 25",
    date: "Due date",
    add: "＋ Add homework",
    total: (a, p, d) => `Total: ${a} | Pending: ${p} | Completed: ${d}`,
    empty: "No homework yet. Add your first task!",
    due: "Due: ",
    noDate: "No due date",
    overdue: "⚠️ Overdue",
    today: "🔔 Due today",
    left: n => `${n} day(s) left`,
    soon: n => `Due soon — ${n} day(s) left`,
    delete: "Delete",
    invalid: "Please enter a homework name.",
    footer: "Data is saved in this browser on this device."
  },

  ja: {
    language: "言語",
    title: "📚 宿題管理",
    subtitle: "宿題を整理して、提出期限を忘れないようにしましょう。",
    task: "宿題の名前",
    placeholder: "例：数学 25ページ",
    date: "提出期限",
    add: "＋ 宿題を追加",
    total: (a, p, d) => `合計 ${a} 件 | 未完了 ${p} 件 | 完了 ${d} 件`,
    empty: "宿題はまだありません。",
    due: "提出期限：",
    noDate: "期限なし",
    overdue: "⚠️ 期限切れ",
    today: "🔔 今日が提出期限",
    left: n => `あと ${n} 日`,
    soon: n => `期限間近：あと ${n} 日`,
    delete: "削除",
    invalid: "宿題の名前を入力してください。",
    footer: "データはこの端末のブラウザーに保存されます。"
  },

  zh: {
    language: "语言",
    title: "📚 作业管理",
    subtitle: "整理作业，不要错过截止日期。",
    task: "作业名称",
    placeholder: "例如：数学，第25页",
    date: "截止日期",
    add: "＋ 添加作业",
    total: (a, p, d) => `共 ${a} 项 | 待完成 ${p} 项 | 已完成 ${d} 项`,
    empty: "还没有作业，添加第一个任务吧！",
    due: "截止日期：",
    noDate: "未设置截止日期",
    overdue: "⚠️ 已逾期",
    today: "🔔 今天截止",
    left: n => `还剩 ${n} 天`,
    soon: n => `即将截止，还剩 ${n} 天`,
    delete: "删除",
    invalid: "请输入作业名称。",
    footer: "数据保存在此设备的浏览器中。"
  },

  ko: {
    language: "언어",
    title: "📚 숙제 관리",
    subtitle: "숙제를 정리하고 제출 기한을 놓치지 마세요.",
    task: "숙제 이름",
    placeholder: "예: 수학 25페이지",
    date: "제출 기한",
    add: "＋ 숙제 추가",
    total: (a, p, d) => `전체 ${a}개 | 미완료 ${p}개 | 완료 ${d}개`,
    empty: "아직 숙제가 없습니다.",
    due: "제출 기한: ",
    noDate: "기한 없음",
    overdue: "⚠️ 기한 초과",
    today: "🔔 오늘 마감",
    left: n => `${n}일 남음`,
    soon: n => `마감 임박 — ${n}일 남음`,
    delete: "삭제",
    invalid: "숙제 이름을 입력하세요.",
    footer: "데이터는 이 기기의 브라우저에 저장됩니다."
  },

  es: {
    language: "Idioma",
    title: "📚 Organizador de tareas",
    subtitle: "Organiza tus tareas y no olvides ninguna fecha.",
    task: "Nombre de la tarea",
    placeholder: "Ej.: Matemáticas, página 25",
    date: "Fecha de entrega",
    add: "＋ Añadir tarea",
    total: (a, p, d) => `Total: ${a} | Pendientes: ${p} | Completadas: ${d}`,
    empty: "Todavía no hay tareas. ¡Añade la primera!",
    due: "Entrega: ",
    noDate: "Sin fecha de entrega",
    overdue: "⚠️ Fecha vencida",
    today: "🔔 Se entrega hoy",
    left: n => `Quedan ${n} día(s)`,
    soon: n => `Próxima entrega: ${n} día(s)`,
    delete: "Eliminar",
    invalid: "Introduce el nombre de la tarea.",
    footer: "Las tareas se guardan en este navegador."
  },

  fr: {
    language: "Langue",
    title: "📚 Suivi des devoirs",
    subtitle: "Organisez vos devoirs et ne manquez aucune échéance.",
    task: "Nom du devoir",
    placeholder: "Ex. : Mathématiques, page 25",
    date: "Date limite",
    add: "＋ Ajouter un devoir",
    total: (a, p, d) => `Total : ${a} | En attente : ${p} | Terminés : ${d}`,
    empty: "Aucun devoir pour le moment.",
    due: "Date limite : ",
    noDate: "Aucune date limite",
    overdue: "⚠️ En retard",
    today: "🔔 À rendre aujourd’hui",
    left: n => `Encore ${n} jour(s)`,
    soon: n => `Bientôt dû — ${n} jour(s)`,
    delete: "Supprimer",
    invalid: "Veuillez saisir le nom du devoir.",
    footer: "Les devoirs sont enregistrés dans ce navigateur."
  }
};

const $ = id => document.getElementById(id);

const languageSelect = $("language");
const taskInput = $("taskInput");
const dateInput = $("dateInput");
const taskForm = $("taskForm");
const taskList = $("taskList");

let tasks = [];
let language = "th";

try {
  const saved = JSON.parse(
    localStorage.getItem("homeworkTasks") || "[]"
  );

  if (Array.isArray(saved)) {
    tasks = saved
      .filter(t =>
        t &&
        typeof t.name === "string" &&
        typeof t.done === "boolean"
      )
      .map(t => ({
        id: t.id ?? String(Date.now() + Math.random()),
        name: t.name,
        dueDate: typeof t.dueDate === "string" ? t.dueDate : "",
        done: t.done
      }));
  }

  const savedLanguage = localStorage.getItem("homeworkLanguage");

  if (savedLanguage && translations[savedLanguage]) {
    language = savedLanguage;
  } else {
    const browserLanguage =
      (navigator.language || "en").slice(0, 2).toLowerCase();

    language = translations[browserLanguage]
      ? browserLanguage
      : "en";
  }
} catch (error) {
  tasks = [];
  language = "en";
}

function t() {
  return translations[language] || translations.en;
}

function todayISO() {
  const now = new Date();

  return [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");
}

function validDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) {
    return false;
  }

  const [year, month, day] = value.split("-").map(Number);
  const date = new Date(year, month - 1, day);

  return date.getFullYear() === year &&
    date.getMonth() === month - 1 &&
    date.getDate() === day;
}

function saveTasks() {
  try {
    localStorage.setItem(
      "homeworkTasks",
      JSON.stringify(tasks)
    );
  } catch (error) {
    alert("Unable to save data in this browser.");
  }
}

function saveLanguage() {
  try {
    localStorage.setItem("homeworkLanguage", language);
  } catch (error) {
    // The page can still work if storage is unavailable.
  }
}

function formatDate(value) {
  if (!value || !validDate(value)) {
    return t().noDate;
  }

  const [year, month, day] = value.split("-");

  if (language === "en") {
    return `${month}/${day}/${year}`;
  }

  return `${day}/${month}/${year}`;
}

function applyLanguage() {
  const text = t();

  document.documentElement.lang = language;
  document.title = text.title.replace("📚 ", "");

  $("languageLabel").textContent = "🌐 " + text.language;
  languageSelect.setAttribute("aria-label", text.language);
  $("title").textContent = text.title;
  $("subtitle").textContent = text.subtitle;
  $("taskLabel").textContent = text.task;
  taskInput.placeholder = text.placeholder;
  $("dateLabel").textContent = text.date;
  $("addButton").textContent = text.add;
  $("footer").textContent = text.footer;

  languageSelect.value = language;

  renderTasks();
}

function renderTasks() {
  const text = t();
  taskList.replaceChildren();

  const completed = tasks.filter(task => task.done).length;
  const pending = tasks.length - completed;

  $("summary").textContent =
    text.total(tasks.length, pending, completed);

  if (tasks.length === 0) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = text.empty;
    taskList.appendChild(empty);
    return;
  }

  const today = todayISO();

  const sorted = [...tasks].sort((a, b) => {
    if (a.done !== b.done) {
      return Number(a.done) - Number(b.done);
    }

    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;

    return a.dueDate.localeCompare(b.dueDate);
  });

  sorted.forEach(task => {
    const item = document.createElement("li");
    item.className = "task";

    if (task.done) {
      item.classList.add("completed");
    }

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "task-checkbox";
    checkbox.checked = task.done;
    checkbox.setAttribute("aria-label", task.name);

    checkbox.addEventListener("change", () => {
      task.done = checkbox.checked;
      saveTasks();
      renderTasks();
    });

    const info = document.createElement("div");
    info.className = "task-info";

    const name = document.createElement("div");
    name.className = "task-name";
    name.textContent = task.name;

    const date = document.createElement("div");
    date.className = "task-date";
    date.textContent = text.due + formatDate(task.dueDate);

    info.append(name, date);

    if (task.dueDate && validDate(task.dueDate) && !task.done) {
      const status = document.createElement("div");
      status.className = "status";

      if (task.dueDate < today) {
        status.classList.add("overdue");
        status.textContent = text.overdue;
      } else if (task.dueDate === today) {
        status.classList.add("today");
        status.textContent = text.today;
      } else {
        const [y1, m1, d1] = today.split("-").map(Number);
        const [y2, m2, d2] = task.dueDate.split("-").map(Number);

        const start = Date.UTC(y1, m1 - 1, d1);
        const end = Date.UTC(y2, m2 - 1, d2);
        const days = Math.round((end - start) / 86400000);

        if (days <= 3) {
          status.classList.add("soon");
          status.textContent = text.soon(days);
        } else {
          status.textContent = text.left(days);
        }
      }

      info.appendChild(status);
    }

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-button";
    deleteButton.textContent = text.delete;

    deleteButton.addEventListener("click", () => {
      tasks = tasks.filter(item => item.id !== task.id);
      saveTasks();
      renderTasks();
    });

    item.append(checkbox, info, deleteButton);
    taskList.appendChild(item);
  });
}

languageSelect.addEventListener("change", event => {
  language = translations[event.target.value]
    ? event.target.value
    : "en";

  saveLanguage();
  applyLanguage();
});

taskForm.addEventListener("submit", event => {
  event.preventDefault();

  const name = taskInput.value.trim();
  const dueDate = dateInput.value;

  if (!name) {
    alert(t().invalid);
    taskInput.focus();
    return;
  }

  if (dueDate && !validDate(dueDate)) {
    alert("Please select a valid date.");
    return;
  }

  tasks.push({
    id: window.crypto && crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now() + Math.random()),
    name,
    dueDate,
    done: false
  });

  saveTasks();
  renderTasks();

  taskForm.reset();
  taskInput.focus();
});

applyLanguage();
</script>
</body>
</html>
