<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple multilingual homework tracker.">
  <title>Homework Tracker</title>

  <style>
    :root {
      --primary: #6759e8;
      --primary-dark: #5143d0;
      --bg: #f5f6fc;
      --card: #ffffff;
      --text: #25263a;
      --muted: #777b91;
      --border: #e5e7f0;
      --green: #159b68;
      --red: #e24b60;
      --orange: #d88917;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding: 28px 16px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      background: var(--primary);
      color: white;
      border-radius: 13px;
      font-size: 23px;
    }

    .language-select {
      width: auto;
      max-width: 155px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      color: var(--text);
    }

    .hero {
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(27px, 5vw, 38px);
      margin: 0 0 8px;
      letter-spacing: -0.7px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 17px;
      border-radius: 17px;
      min-width: 0;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 9px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: 800;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 6px 24px rgba(35, 38, 80, 0.035);
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 19px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      min-height: 47px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .field input:focus,
    .language-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(103, 89, 232, 0.12);
    }

    .hint {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 7px;
    }

    .primary-btn {
      width: 100%;
      min-height: 47px;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      background: var(--primary);
      font-weight: 700;
      transition: background 0.2s, transform 0.2s;
    }

    .primary-btn:hover {
      background: var(--primary-dark);
    }

    .primary-btn:active {
      transform: scale(0.99);
    }

    .list-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .list-heading h2 {
      margin: 0;
      font-size: 19px;
    }

    .task-count {
      color: var(--muted);
      font-size: 13px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 17px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 13px;
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .task-list {
      display: grid;
      gap: 11px;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      min-width: 0;
    }

    .task.done {
      background: #f9fbfa;
    }

    .task-check {
      width: 20px;
      height: 20px;
      margin: 2px 0 0;
      accent-color: var(--primary);
      flex-shrink: 0;
      cursor: pointer;
    }

    .task-main {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-weight: 700;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .task.done .task-title {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-top: 9px;
    }

    .date-label {
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 7px;
    }

    .status.pending {
      background: #efedff;
      color: #5a4bcf;
    }

    .status.soon {
      background: #fff3d9;
      color: #9a6200;
    }

    .status.overdue {
      background: #ffeaed;
      color: #c52e45;
    }

    .status.completed {
      background: #e3f7ee;
      color: #087a50;
    }

    .delete-btn {
      border: none;
      background: #fff0f1;
      color: var(--red);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #ffdde1;
    }

    .empty {
      text-align: center;
      padding: 35px 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .empty-icon {
      display: block;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 12px 0 4px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand {
        font-size: 17px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
      }

      .language-select {
        max-width: 135px;
        font-size: 12px;
      }

      .stats {
        gap: 8px;
      }

      .stat {
        padding: 12px 10px;
        border-radius: 13px;
      }

      .stat-label {
        font-size: 11px;
      }

      .stat-number {
        font-size: 23px;
      }

      .panel {
        padding: 16px;
        border-radius: 16px;
      }

      .task {
        padding: 12px;
        gap: 9px;
      }

      .delete-btn {
        padding: 7px 8px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">✓</span>
        <span>StudySpace</span>
      </div>

      <select
        id="languageSelect"
        class="language-select"
        aria-label="Select language"
      >
        <option value="th">🇹🇭 ไทย</option>
        <option value="en">🇬🇧 English</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
      </select>
    </header>

    <section class="hero">
      <h1 id="pageTitle">จัดการการบ้านของคุณ ✨</h1>
      <p id="pageSubtitle">วางแผนงานให้ดี แล้วค่อย ๆ ทำให้สำเร็จทีละอย่าง</p>
    </section>

    <section class="stats" aria-label="Homework statistics">
      <div class="stat">
        <div class="stat-label" id="totalLabel">งานทั้งหมด</div>
        <div class="stat-number" id="totalCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="pendingLabel">ยังไม่เสร็จ</div>
        <div class="stat-number" id="pendingCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="completedLabel">เสร็จแล้ว</div>
        <div class="stat-number" id="completedCount">0</div>
      </div>
    </section>

    <section class="panel">
      <h2 id="addHeading">＋ เพิ่มการบ้าน</h2>

      <form id="taskForm">
        <div class="field">
          <label for="taskInput" id="taskLabel">ชื่อการบ้าน</label>
          <input
            id="taskInput"
            type="text"
            maxlength="200"
            placeholder="เช่น ทำรายงานวิชาวิทยาศาสตร์"
            required
          >
        </div>

        <div class="field">
          <label for="dateInput" id="dateLabel">วันกำหนดส่ง (ไม่บังคับ)</label>
          <input
            id="dateInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="เช่น 18/10/2026"
          >
          <span class="hint" id="dateHint">
            พิมพ์วันที่เองได้ เช่น 18/10/2026, 18-10-2026 หรือ 2026-10-18
          </span>
        </div>

        <button class="primary-btn" id="addButton" type="submit">
          ＋ เพิ่มการบ้าน
        </button>
      </form>
    </section>

    <section class="panel">
      <div class="list-heading">
        <h2 id="listHeading">📚 รายการการบ้าน</h2>
        <span class="task-count" id="visibleCount">0 งาน</span>
      </div>

      <div class="filters" aria-label="Homework filters">
        <button class="filter-btn active" data-filter="all" id="filterAll" type="button">ทั้งหมด</button>
        <button class="filter-btn" data-filter="pending" id="filterPending" type="button">ยังไม่เสร็จ</button>
        <button class="filter-btn" data-filter="completed" id="filterCompleted" type="button">เสร็จแล้ว</button>
      </div>

      <div class="task-list" id="taskList"></div>
    </section>

    <footer class="footer" id="footerText">
      ข้อมูลการบ้านบันทึกไว้ในเบราว์เซอร์ของคุณ
    </footer>
  </main>

        invalidDate: "Fecha no válida. Prueba 18/10/2026 o 2026-10-18.",
        storageError: "El navegador no pudo guardar los datos.",
        confirmDelete: "¿Eliminar esta tarea?",
        footer: "Tus tareas se guardan en este navegador."
      }
    };

    const $ = (id) => document.getElementById(id);

    const languageSelect = $("languageSelect");
    const taskForm = $("taskForm");
    const taskInput = $("taskInput");
    const dateInput = $("dateInput");
    const taskList = $("taskList");

    let language = "en";
    let currentFilter = "all";
    let tasks = loadTasks();

    function t() {
      return translations[language] || translations.en;
    }

    function loadTasks() {
      try {
        const saved = localStorage.getItem("studyspace-homework-v1");
        const parsed = saved ? JSON.parse(saved) : [];

        if (!Array.isArray(parsed)) return [];

        return parsed.filter((task) =>
          task &&
          typeof task.id === "string" &&
          typeof task.title === "string" &&
          typeof task.completed === "boolean" &&
          (task.dueDate === "" ||
            (typeof task.dueDate === "string" &&
             /^\d{4}-\d{2}-\d{2}$/.test(task.dueDate)))
        );
      } catch (error) {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(
          "studyspace-homework-v1",
          JSON.stringify(tasks)
        );
        return true;
      } catch (error) {
        alert(t().storageError);
        return false;
      }
    }

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function todayISO() {
      const now = new Date();
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    // Convert supported date formats to YYYY-MM-DD.
    // Numeric dates containing slashes or dashes are interpreted as DD/MM/YYYY,
    // except when the year appears first.
    function parseFlexibleDate(value) {
      value = value.trim();

      if (!value) return "";

      let year;
      let month;
      let day;
      let match;

      // YYYY-MM-DD, YYYY/MM/DD, YYYY.MM.DD
      match = value.match(
        /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/
      );

      if (match) {
        year = Number(match[1]);
        month = Number(match[2]);
        day = Number(match[3]);
      } else {
        // DD/MM/YYYY, DD-MM-YYYY, DD.MM.YYYY
        match = value.match(
          /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/
        );

        if (match) {
          day = Number(match[1]);
          month = Number(match[2]);
          year = Number(match[3]);
        } else {
          // Also accept dates such as "18 Oct 2026".
          const parsed = new Date(value);

          if (Number.isNaN(parsed.getTime())) {
            return null;
          }

          year = parsed.getFullYear();
          month = parsed.getMonth() + 1;
          day = parsed.getDate();
        }
      }

      if (year < 1000 || year > 9999) {
        return null;
      }

      const date = new Date(year, month - 1, day);

      // Reject impossible dates such as 31/02/2026.
      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }

      return `${year}-${pad(month)}-${pad(day)}`;
    }

    function formatDate(isoDate) {
      if (!isoDate) return "";

      const [year, month, day] = isoDate.split("-").map(Number);

      // Use a fixed locale and UTC to avoid date shifts.
      const date = new Date(Date.UTC(year, month - 1, day, 12));

      const locales = {
        th: "th-TH",
        en: "en-US",
        zh: "zh-CN",
        ja: "ja-JP",
        ko: "ko-KR",
        fr: "fr-FR",
        es: "es-ES"
      };

      return new Intl.DateTimeFormat(locales[language] || "en-US", {
        day: "numeric",
        month: "short",
        year: "numeric",
        timeZone: "UTC"
      }).format(date);
    }

    function dateStatus(task) {
      if (task.completed) {
        return { text: t().done, className: "completed" };
      }

      if (!task.dueDate) {
        return null;
      }

      const today = todayISO();

      if (task.dueDate < today) {
        return { text: t().overdue, className: "overdue" };
      }

      if (task.dueDate === today) {
        return { text: t().dueToday, className: "soon" };
      }

      const difference =
        (Date.parse(task.dueDate + "T12:00:00Z") -
         Date.parse(today + "T12:00:00Z")) /
        86400000;

      if (difference <= 3) {
        return { text: t().dueSoon, className: "soon" };
      }

      return { text: t().upcoming, className: "pending" };
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;

      return element;
    }

    function renderStats() {
      $("totalCount").textContent = tasks.length;
      $("pendingCount").textContent =
        tasks.filter((task) => !task.completed).length;
      $("completedCount").textContent =
        tasks.filter((task) => task.completed).length;
    }

    function renderTasks() {
      taskList.replaceChildren();

      const visibleTasks = tasks.filter((task) => {
        if (currentFilter === "pending") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      $("visibleCount").textContent =
        `${visibleTasks.length} ${t().taskUnit}`;

      if (visibleTasks.length === 0) {
        const empty = makeElement("div", "empty");
        empty.appendChild(
          makeElement("span", "empty-icon", t().emptyIcon)
        );

        const message =
          tasks.length === 0 && currentFilter === "all"
            ? t().empty
            : t().emptyFiltered;

        empty.appendChild(makeElement("div", "", message));
        taskList.appendChild(empty);
        return;
      }

      // Sort unfinished tasks first, then by due date.
      visibleTasks.sort((a, b) => {
        if (a.completed !== b.completed) {
          return a.completed ? 1 : -1;
        }

        if (!a.dueDate && b.dueDate) return 1;
        if (a.dueDate && !b.dueDate) return -1;

        return a.dueDate.localeCompare(b.dueDate);
      });

      for (const task of visibleTasks) {
        const card = makeElement(
          "article",
          task.completed ? "task done" : "task"
        );

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.completed;
        checkbox.setAttribute(
          "aria-label",
          task.completed ? t().done : t().pending
        );

        checkbox.addEventListener("change", () => {
          const oldValue = task.completed;
          task.completed = checkbox.checked;

          if (!saveTasks()) {
            task.completed = oldValue;
          }

          render();
        });

        const main = makeElement("div", "task-main");
        main.appendChild(makeElement("div", "task-title", task.title));

        const meta = makeElement("div", "task-meta");

        if (task.dueDate) {
          meta.appendChild(
            makeElement(
              "span",
              "date-label",
              `${t().due}: ${formatDate(task.dueDate)}`
            )
          );
        } else {
          meta.appendChild(makeElement("span", "date-label", t().noDate));
        }

        const status = dateStatus(task);

        if (status) {
          meta.appendChild(
            makeElement("span", `status ${status.className}`, status.text)
          );
        }

        main.appendChild(meta);

        const deleteButton = makeElement(
          "button",
          "delete-btn",
          t().delete
        );
        deleteButton.type = "button";
        deleteButton.addEventListener("click", () => {
          if (!confirm(t().confirmDelete)) return;

          const previousTasks = tasks;
          tasks = tasks.filter((item) => item.id !== task.id);

          if (!saveTasks()) {
            tasks = previousTasks;
          }

          render();
        });

        card.append(checkbox, main, deleteButton);
        taskList.appendChild(card);
      }
    }

    function renderLanguage() {
      const text = t();

      document.documentElement.lang = language;

      $("pageTitle").textContent = text.title;
      $("pageSubtitle").textContent = text.subtitle;
      $("totalLabel").textContent = text.total;
      $("pendingLabel").textContent = text.pending;
      $("completedLabel").textContent = text.completed;
      $("addHeading").textContent = text.addHeading;
      $("taskLabel").textContent = text.taskLabel;
      $("taskInput").placeholder = text.taskPlaceholder;
      $("dateLabel").textContent = text.dateLabel;
      $("dateHint").textContent = text.dateHint;
      $("addButton").textContent = text.addButton;
      $("listHeading").textContent = text.listHeading;
      $("filterAll").textContent = text.all;
      $("filterPending").textContent = text.pendingFilter;
      $("filterCompleted").textContent = text.completedFilter;
      $("footerText").textContent = text.footer;

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.filter === currentFilter
        );
      });
    }

    function render() {
      renderLanguage();
      renderStats();
      renderTasks();
    }

    taskForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const title = taskInput.value.trim();
      const rawDate = dateInput.value.trim();

      if (!title) {
        taskInput.focus();
        return;
      }

      const dueDate = rawDate ? parseFlexibleDate(rawDate) : "";

      if (dueDate === null) {
        alert(t().invalidDate);
        dateInput.focus();
        return;
      }

      const newTask = {
        id: (
          typeof crypto !== "undefined" &&
          typeof crypto.randomUUID === "function"
        )
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        dueDate,
        completed: false
      };

      tasks.push(newTask);

      if (!saveTasks()) {
        tasks.pop();
        return;
      }

      taskInput.value = "";
      dateInput.value = "";
      currentFilter = "all";
      render();
      taskInput.focus();
    });

    languageSelect.addEventListener("change", () => {
      language = translations[languageSelect.value]
        ? languageSelect.value
        : "en";

      try {
        localStorage.setItem("studyspace-language", language);
      } catch (error) {
        // Language selection still works for this session.
      }

      render();
    });

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        document.querySelectorAll("[data-filter]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });

        renderTasks();
      });
    });

    try {
      const savedLanguage = localStorage.getItem("studyspace-language");

      if (savedLanguage && translations[savedLanguage]) {
        language = savedLanguage;
      }
    } catch (error) {
      // Continue with the default language.
    }

    languageSelect.value = language;
    render();
  </script>
</body>
</html>
